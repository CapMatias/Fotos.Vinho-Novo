<body>

<div class="page">

  <header class="hero">
    <img class="hero__mark" src="/marca.png" alt="" aria-hidden="true">
    <img class="hero__mark hero__mark--2" src="/marca.png" alt="" aria-hidden="true">
    <img class="hero__logo" src="/logo.png" alt="Igreja Evangélica Vinho Novo em Saquarema">
    <h1 class="hero__titulo">Fotos da igreja</h1>
    <p class="hero__sub">Escolha o álbum, veja as fotos e leve para o seu celular. É de graça e não precisa de cadastro.</p>
  </header>

  <main class="conteudo">
    <div class="painel-branco">
      <label class="campo__rotulo" for="busca">Procurar um álbum</label>
      <input id="busca" class="busca" type="search" placeholder="Batismo, Natal, retiro..." autocomplete="off">

      <div class="barra escondido" id="avisoCaixa">
        <button class="botao botao--calmo botao--miudo" id="avisoBotao" type="button"></button>
        <span class="barra__conta" id="avisoTexto"></span>
      </div>

      <p id="recado" class="aviso">Carregando os álbuns...</p>
      <ul id="lista" class="albuns"></ul>
    </div>
  </main>

  <footer class="rodape">
    Igreja Evangélica Vinho Novo em Saquarema
  </footer>

</div>

<script>
// ----------------------------------------------------------------- avisos
// Quem quiser é avisado no celular quando entrar álbum novo. No iPhone só
// funciona depois de "Adicionar à Tela de Início"; no Android funciona no
// navegador mesmo.
(function () {
  "use strict";

  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return;

  var caixa = document.getElementById("avisoCaixa");
  var botao = document.getElementById("avisoBotao");
  var texto = document.getElementById("avisoTexto");
  var registro = null;
  var chavePublica = "";

  // A chave vem em base64url e o navegador quer bytes.
  function paraBytes(base64url) {
    var base64 = (base64url + "=".repeat((4 - base64url.length % 4) % 4))
      .replace(/-/g, "+").replace(/_/g, "/");
    var cru = atob(base64);
    var bytes = new Uint8Array(cru.length);
    for (var i = 0; i < cru.length; i++) bytes[i] = cru.charCodeAt(i);
    return bytes;
  }

  function mostrar(modo, recado) {
    caixa.classList.remove("escondido");
    botao.textContent = modo === "sair" ? "Desligar os avisos" : "Receber aviso de álbum novo";
    botao.disabled = false;
    texto.textContent = recado || "";
    botao.onclick = modo === "sair" ? desligar : ligar;
  }

  function contar(inscricao, sair) {
    var dados = sair
      ? { endpoint: inscricao.endpoint, sair: true }
      : (function () {
          var j = inscricao.toJSON();
          return { endpoint: inscricao.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth };
        })();
    return fetch("/api/inscrever", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dados)
    });
  }

  function ligar() {
    botao.disabled = true;
    texto.textContent = "Pedindo permissão...";
    Notification.requestPermission().then(function (permissao) {
      if (permissao !== "granted") {
        mostrar("entrar", permissao === "denied"
          ? "Você bloqueou os avisos nas configurações do navegador."
          : "Sem problema — você pode ligar depois.");
        return;
      }
      return registro.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: paraBytes(chavePublica)
      }).then(function (inscricao) {
        return contar(inscricao, false).then(function () {
          mostrar("sair", "Pronto! Você será avisado quando entrar álbum novo.");
        });
      });
    }).catch(function () {
      mostrar("entrar", "Não consegui ligar os avisos neste aparelho.");
    });
  }

  function desligar() {
    botao.disabled = true;
    registro.pushManager.getSubscription().then(function (inscricao) {
      if (!inscricao) { mostrar("entrar", ""); return; }
      return contar(inscricao, true)
        .then(function () { return inscricao.unsubscribe(); })
        .then(function () { mostrar("entrar", "Avisos desligados."); });
    }).catch(function () { mostrar("sair", "Não consegui desligar agora."); });
  }

  navigator.serviceWorker.register("/sw.js").then(function (reg) {
    registro = reg;
    return fetch("/api/chave-aviso").then(function (r) { return r.json(); });
  }).then(function (dado) {
    if (!dado || !dado.ligado) return;          // avisos não configurados
    chavePublica = dado.chave;
    return registro.pushManager.getSubscription().then(function (inscricao) {
      if (inscricao) {
        mostrar("sair", "");
      } else if (Notification.permission === "denied") {
        // Já bloqueou antes: explica em vez de sumir sem dizer nada.
        caixa.classList.remove("escondido");
        botao.classList.add("escondido");
        texto.textContent = "Os avisos estão bloqueados para este site nas configurações do navegador.";
      } else {
        mostrar("entrar", "");
      }
    });
  }).catch(function () { /* sem avisos: a galeria funciona igual */ });
})();

// ---------------------------------------------------------------- galeria
(function () {
  "use strict";

  var lista = document.getElementById("lista");
  var recado = document.getElementById("recado");
  var busca = document.getElementById("busca");
  var albuns = [];

  var MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho",
               "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

  // "2026-08-15" -> "15 de agosto de 2026"
  function porExtenso(data) {
    var p = String(data || "").split("-");
    if (p.length !== 3) return "";
    return Number(p[2]) + " de " + MESES[Number(p[1]) - 1] + " de " + p[0];
  }

  function contagem(n) {
    return n + (n === 1 ? " foto" : " fotos");
  }

  function mostrarRecado(texto, tipo) {
    recado.textContent = texto;
    recado.className = "aviso" + (tipo ? " aviso--" + tipo : "");
    recado.hidden = !texto;
  }

  function desenhar() {
    var termo = busca.value.trim().toLowerCase();
    var visiveis = albuns.filter(function (a) {
      if (!termo) return true;
      return (a.titulo + " " + a.descricao + " " + porExtenso(a.data_evento)).toLowerCase().indexOf(termo) !== -1;
    });

    lista.textContent = "";
    visiveis.forEach(function (a, indice) {
      var item = document.createElement("li");

      var link = document.createElement("a");
      link.className = "album";
      link.href = "/album/" + encodeURIComponent(a.slug);

      if (a.capa) {
        var img = document.createElement("img");
        img.className = "album__capa";
        img.src = a.capa;
        img.alt = "";
        img.loading = "lazy";
        link.appendChild(img);
      } else {
        var vazia = document.createElement("div");
        vazia.className = "album__vazia";
        vazia.textContent = "Sem fotos ainda";
        link.appendChild(vazia);
      }

      var corpo = document.createElement("div");
      corpo.className = "album__corpo";

      var titulo = document.createElement("h2");
      titulo.className = "album__titulo";
      titulo.textContent = a.titulo;
      corpo.appendChild(titulo);

      var meta = document.createElement("p");
      meta.className = "album__meta";
      meta.textContent = porExtenso(a.data_evento) + " • " + contagem(a.fotos);
      corpo.appendChild(meta);

      if (a.descricao) {
        var desc = document.createElement("p");
        desc.className = "album__desc";
        desc.textContent = a.descricao;
        corpo.appendChild(desc);
      }

      link.appendChild(corpo);
      item.appendChild(link);
      // um card depois do outro, bem de leve
      item.style.animationDelay = Math.min(indice * 45, 400) + "ms";
      lista.appendChild(item);
    });

    if (!albuns.length) {
      mostrarRecado("Ainda não há álbuns publicados. Volte em breve.", "");
    } else if (!visiveis.length) {
      mostrarRecado("Nenhum álbum com esse nome.", "");
    } else {
      mostrarRecado("", "");
    }
  }

  busca.addEventListener("input", desenhar);

  fetch("/api/albuns")
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("http " + r.status)); })
    .then(function (dado) {
      albuns = dado.albuns || [];
      desenhar();
    })
    .catch(function () {
      mostrarRecado("Não consegui carregar os álbuns. Confira a internet e tente de novo.", "erro");
    });
})();
</script>
</body>
